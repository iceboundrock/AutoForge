# AutoForge example configuration (v1).
#
# Copy to autoforge.yaml (or .toml/.json) and adjust. Logical profile names
# (analyze_execute, fix, review_round_1, ...) are stable; the actual CLI
# command / model identifiers live here so controller source never changes
# when vendors rename flags or models.
#
# CLI facts these defaults were checked against (2026-09):
#   claude   2.1.x   -> claude -p --output-format text --model <alias> --effort <e>
#                       --permission-mode <mode> --no-session-persistence -- <prompt>
#   opencode 1.18.x  -> opencode run -m <provider/model> --variant <effort>
#                       --format default [--auto] <prompt>
#   gh       2.x     -> gh pr view --json ..., gh issue view --json ..., gh api ...
# Real model ids (from `opencode models` and `claude --help`):
#   claude:   fable            (alias resolved by the CLI to claude-fable-5-1)
#   opencode: openai/gpt-5.6-luna, openai/gpt-5.6-terra, openai/gpt-5.6-sol

version: 1

state_dir: .autoforge

prompt_version: v1

execution:
  default_timeout_seconds: 1800
  # A malformed CONTROL_RESULT with exit code 0 triggers at most this many
  # correction prompts before the step fails (0 disables correction).
  max_correction_attempts: 1

safety:
  # Controller invariant: no real merge unless this is true AND the CLI is
  # invoked with --allow-merge. Automatic merge is disabled in this milestone.
  allow_merge: false
  # Paths a PR may not change and still be merged unattended. GitHub runs the
  # *PR's own* copy of `.github/workflows/` and reports it under the same
  # check name, so a PR that edits those files also edits what "every check
  # succeeded" means. The controller cannot verify that from the outside, so
  # READY_FOR_MERGE / MERGE BLOCK such a PR for a human instead of merging it.
  # Both ends of a rename are matched, so a PR cannot move a protected file
  # out of the protected range instead of editing it.
  # Entries ending in "/" are directory prefixes; anything else is an exact
  # path or an fnmatch pattern. An empty list ([]) disables the gate; leaving
  # this key empty is a configuration error, not a silent opt-out.
  # This gates the *definition* of the checks, not the trustworthiness of a
  # green run: the commands still execute the PR's own code.
  protected_merge_paths:
    - ".github/workflows/"

merge:
  # How the CONTROLLER merges once the gate above is open. Agents never merge:
  # the engine itself runs `gh pr merge --<method> --match-head-commit <reviewed HEAD>`
  # and counts the merge only after GitHub reports the PR as MERGED. Before
  # writing it verifies on GitHub (fail closed): not a draft, all checks
  # succeeded, mergeable, mergeStateStatus CLEAN/HAS_HOOKS, no auto-merge
  # armed, no merge queue on the base branch.
  # The same verification runs in READY_FOR_MERGE before MERGE is entered.
  method: squash          # squash | merge | rebase
  delete_branch: false    # add --delete-branch
  # Inconclusive GitHub data (mergeable UNKNOWN, checks still running, the
  # post-merge re-read failed) is re-checked on `resume --allow-merge` (or
  # `step --allow-merge`), one attempt per invocation, at most this many
  # times per phase; then the run is BLOCKED instead of retrying forever.
  max_verification_attempts: 5

workflow:
  # Loop bounds enforced by the controller (never by a prompt). Each one ends
  # the run in BLOCKED with the reason in `block_reason` / `status`, unless an
  # eligible replan below replaces the non-converging PR.
  # Hard cap on completed review rounds per PR. A round at the cap with
  # findings first evaluates replan policy; otherwise it blocks rather than
  # starting a FIX whose result could never be reviewed.
  max_review_rounds: 20
  # Stagnation: this many consecutive rounds with findings whose
  # `required_resolution` texts are identical (ids/locations ignored,
  # whitespace/case-normalised) -> BLOCKED, unless the round has reached
  # `review.replan.soft_threshold`, which turns it into a replan trigger.
  # 0 disables the rule; 1 is rejected (both rules compare consecutive
  # rounds, so 2 is the minimum).
  stagnation_identical_rounds: 2
  # Stagnation: this many consecutive rounds with findings whose finding
  # count did not change AND in which some `required_resolution` recurs
  # (A/B/A ping-pong). Same routing as above. Rounds of entirely new
  # findings are progress and only meet max_review_rounds. 0 disables the
  # rule; 1 is rejected (a one-round window can never contain a recurrence).
  stagnation_unchanged_count_rounds: 3
  # Cumulative step budget of the whole run (all phases, all issues). It is
  # measured on the persisted `step_count`, so `resume` continues the same
  # budget; `--max-steps` only bounds a single invocation.
  max_total_steps: 300

review:
  # After a review with findings, the controller (never an agent) may abandon
  # the patch-accumulated PR and create a fresh implementation attempt.
  #
  # Closing the superseded PR is the controller's only destructive write on
  # agent-produced work, so REPLAN_REEXECUTE runs as one durable transaction
  # persisted in `.autoforge/state.json` as `replan_transaction`. There is
  # nothing to configure about it, but it is worth knowing what it enforces:
  #   * the replacement is identified ONLY by the controller-generated
  #     transaction id it publishes in an `autoforge-replan-transaction`
  #     marker in its PR body -- never by branch shape, PR count or the
  #     agent's own report, and never a PR that already existed;
  #   * the old PR is closed only while both it and the replacement still
  #     match the checkpoint taken before the agent ran;
  #   * the intent to close is persisted before the close, and a close receipt
  #     is posted only after the close is observed (never inside the close
  #     itself), so a crash can tell the controller's own close from a human's;
  #   * a refusal is durable (the run stays BLOCKED across `resume`), while a
  #     transient GitHub failure stays resumable.
  # `autoforge status` prints the transaction id, stage and both PRs.
  replan:
    enabled: true
    # First round from which the controller may replace (rather than keep
    # patching) an implementation. Gates every stagnation trigger, including
    # the workflow.stagnation_* rules above: earlier stagnation -> BLOCKED.
    soft_threshold: 12
    # Findings at or beyond this round always trigger a replan.
    # Must not exceed workflow.max_review_rounds.
    hard_threshold: 20
    stagnation_window: 3
    max_findings_per_round: 2
    # Fresh reimplementations after the initial attempt. Reaching this limit
    # blocks for a human rather than endlessly recreating PRs.
    max_replans_per_issue: 2

profiles:
  analyze_execute:
    provider: claude
    model: fable            # `claude --model`
    effort: high            # `claude --effort` (low|medium|high|xhigh|max)
    command: claude
    timeout_seconds: 1800
    options:
      permission_mode: bypassPermissions   # non-interactive; sandbox the working tree
      output_format: text

  fix:
    provider: claude
    model: fable
    effort: high
    command: claude
    timeout_seconds: 1800
    options:
      permission_mode: bypassPermissions
      output_format: text

  review_round_1:
    provider: opencode
    model: openai/gpt-5.6-luna     # `opencode run -m` (provider/model)
    effort: high                   # `opencode run --variant`
    command: opencode
    timeout_seconds: 1800
    options:
      output_format: default       # final text on stdout (CONTROL_RESULT verbatim)
      auto_approve: false          # add `--auto` only if your OpenCode permissions need it

  review_round_2_5:
    provider: opencode
    model: openai/gpt-5.6-terra
    effort: high
    command: opencode
    timeout_seconds: 1800
    options:
      output_format: default
      auto_approve: false

  review_round_6_plus:
    provider: opencode
    model: openai/gpt-5.6-sol
    effort: medium
    command: opencode
    timeout_seconds: 1200
    options:
      output_format: default
      auto_approve: false

  # An independent logical role: it must not inherit the round-6 reviewer
  # profile. This high-capability model replans and reimplements from latest
  # default branch while retaining historical findings as constraints.
  replan_reexecute:
    provider: opencode
    model: openai/gpt-5.6-terra
    effort: high
    command: opencode
    timeout_seconds: 3600
    options:
      output_format: default
      auto_approve: false

  # Future milestone (reachable only after a controller-performed merge, which
  # is gated by safety.allow_merge + --allow-merge). There is no `merge` agent
  # profile: MERGE is executed by the controller, see `merge:` above.
  update_epic:
    provider: opencode
    model: openai/gpt-5.6-sol
    effort: high
    command: opencode
    timeout_seconds: 1200

github:
  # `gh` binary name / path. All GitHub reads/verification go through `gh`.
  command: gh
  timeout_seconds: 120

# ---------------------------------------------------------------------------
# LOCAL mode (`autoforge local init|run|doctor`).
#
# A separate, GitHub-free workflow over a feature Markdown file and the local
# working tree:
#
#   features/<slug>.md -> ANALYZE_EXECUTE -> REVIEW -> FIX -> REVIEW -> DONE
#
# A local run makes zero `gh` invocations, needs no GitHub authentication,
# creates no PR, pushes nothing and commits nothing: the implementation stays
# in the working tree. It uses the analyze_execute / fix / review_round_1 /
# review_round_2_5 profiles above; there is no replan and no EPIC update.
local:
  # Where `autoforge local init <slug>` writes features/<slug>.md. This is
  # project content you may commit -- never .autoforge/, which stays runtime
  # state. `local init` refuses to overwrite an existing file without --force.
  feature_dir: features

  # Review/fix bound. The default is: REVIEW -> at most one FIX -> REVIEW,
  # then DONE if clean, BLOCKED if findings remain (two review passes, one fix
  # pass). 0 means a single review pass, where any finding blocks. This is
  # deliberately not the 20-round remote loop.
  #
  # Local review rounds are routed to profiles exactly like remote ones, so a
  # bound of 5 or more also makes `review_round_6_plus` reachable and therefore
  # required (checked by `local doctor` and at the start of `local run`).
  max_fix_rounds: 1

  # Controller-owned validation, run by AutoForge (not by an agent) after
  # ANALYZE_EXECUTE and after FIX. Each entry is an argv ARRAY, never a shell
  # string: no shell is involved, so quoting, globs, pipes and `&&` do not
  # work by design. A non-zero exit or a timeout means the phase is not
  # verified and the run stops with the phase unchanged for `resume`.
  # `--dry-run` lists them and runs none of them. Nothing is auto-detected;
  # if this list is empty, the controller runs no checks of its own.
  validation_commands: []
    # - ["uv", "run", "pytest", "-q"]
    # - ["./gradlew", "test"]
    # - ["npm", "--prefix", "frontend", "run", "build"]
