# Hosted verification for the AutoForge controller.
#
# This exists so the controller's own MERGE gate has something real to
# verify. `READY_FOR_MERGE` / `MERGE` require every check on the PR to have
# succeeded; with no hosted checks configured that condition is vacuously
# true. Running the suite here turns "tests passed" from an agent claim into
# GitHub state, which is what the source-of-truth rule asks for.
#
# No repository secrets are needed: the tests use scripted providers and an
# in-memory GitHub fake, and never invoke `gh`, Claude Code or OpenCode for
# real. The one credential present is GitHub's automatic GITHUB_TOKEN, which
# `permissions` below limits to reading the repository's contents.
#
# Trust boundary: GitHub runs the *pull request's* copy of this file and
# reports the result under the same `ci` check name, so a PR that edits this
# workflow also edits what its own green check means. A branch ruleset cannot
# close that — the required check is defined by the branch it gates. The
# controller closes it instead: `safety.protected_merge_paths` (default
# `.github/workflows/`) makes any PR that touches these files BLOCK in
# READY_FOR_MERGE / MERGE for a human to review and merge. See
# docs/development.md, "What a green `ci` does and does not prove".
#
# Every action is pinned to a full commit SHA; the comment names its release.
# A tag can be moved to other code, which would then run under the `ci`
# check name the merge gate reads (#288). tests/test_workflow_pins.py keeps
# every workflow so; docs/development.md, "Pinned actions", says how to
# update a pin.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project floor (`requires-python = ">=3.11"`) and the next
        # release. tests/test_ci_workflow.py asserts the floor stays covered.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Sets UV_PYTHON, which takes precedence over the repo's
          # .python-version pin.
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --locked: install exactly uv.lock and fail if it is stale relative
      # to pyproject.toml, rather than silently re-resolving in CI.
      - run: uv sync --locked --group dev
      # `make test`'s command, plus the JUnit report the duration report
      # reads. That option selects, deselects and changes nothing.
      - id: pytest
        run: uv run pytest --junitxml="${RUNNER_TEMP}/durations/junit.xml"
      # The duration report (#344): the run's counts, skips and times in the
      # job summary and an artifact, compared with main's recent runs of the
      # same interpreter and uv cache state (tests/ci_durations.py;
      # docs/development.md, "Test durations in CI"). Report only: each step
      # below runs whether pytest passed or failed, never when the run was
      # cancelled, and cannot change this job's result (continue-on-error,
      # a timeout of its own), so the required `ci` check means what it meant.
      # Only a push to main saves the history; a pull request reads main's.
      # The cache and artifact actions use the runner's own token for those
      # services, not GITHUB_TOKEN, and need no permission.
      - name: Restore main's duration history
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/durations/history
          key: ci-durations-v1-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-durations-v1-py${{ matrix.python-version }}-
      - name: Report the suite's durations
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 5
        env:
          DURATIONS_PYTHON: ${{ matrix.python-version }}
          DURATIONS_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
          DURATIONS_PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: uv run --no-project python -I tests/ci_durations.py report --dir "${RUNNER_TEMP}/durations" --python "${DURATIONS_PYTHON}" --cache-hit "${DURATIONS_CACHE_HIT}" --pytest-outcome "${DURATIONS_PYTEST_OUTCOME}" --check-run "test (py${DURATIONS_PYTHON})"
      - name: Upload the duration report
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One per attempt: an artifact's name is unique in a run.
          name: durations-py${{ matrix.python-version }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/durations/report/
          if-no-files-found: warn
          # As long as the oldest run a baseline window may hold.
          retention-days: 30
      - name: Save main's duration history
        if: (success() || failure()) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/durations/history
          key: ci-durations-v1-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}

  static:
    # Lint, format and type checks are interpreter-independent (mypy is
    # pinned to python_version = "3.11" in pyproject.toml), so they run once
    # rather than per matrix entry.
    name: lint + format + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src

  sandbox:
    # The outer sandbox's real backend (bubblewrap) on the hosted runner
    # (#169). Whether the runner can enforce it is measured on every run,
    # never assumed: `make test-sandbox-measured` first records bwrap's
    # version and options, the user-namespace policy, an unprivileged
    # namespace launch and the kernel's Landlock ABI, in the log and the job
    # summary (tests/sandbox_host.py), then runs every real-backend test
    # module, which fail instead of skipping whenever that measurement says
    # the runner can enforce. Where it cannot, they skip with the backend
    # probe's typed reason, the summary records what the runner lacks, and
    # `make test-sandbox` is the local target (docs/development.md, "The
    # outer sandbox"). Like every job here it calls no provider and needs no
    # credential.
    name: sandbox (real backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      # The backend as the runner's distribution packages it: which version
      # that is, and what it can do there, is what the job measures.
      - run: sudo apt-get update --quiet && sudo apt-get install --yes --quiet --no-install-recommends bubblewrap
      - run: uv sync --locked --group dev
      - run: make test-sandbox-measured

  dist:
    # The installable artifacts (#256): `make dist-check` builds the sdist
    # and a wheel from that sdist, checks their files and metadata (name
    # `autoforge-cli`, the version, `License-Expression: MIT`, LICENSE in
    # both), installs the wheel non-editably into a fresh environment outside
    # the checkout, and from there runs `autoforge --version` and `--help`,
    # renders every prompt template from the installed package and makes a
    # REMOTE dry run (`autoforge run --dry-run --full-prompt`) in a scratch
    # repository with a `gh` on PATH that records and fails any call, which
    # must render the ANALYZE_EXECUTE prompt, call no `gh` and leave the
    # repository byte-identical (tests/dist_check.py). It runs on every
    # interpreter the `test` matrix runs, which are the ones
    # docs/compatibility.md claims.
    # There is no `uv sync`: the check runs on the bare interpreter and
    # imports only the installed package. Like every job here it calls no
    # provider and needs no credential; its one download is the build
    # backend, from the package index.
    name: dist (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same list as `test`; tests/test_ci_workflow.py keeps them equal.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build backend is third-party code; it gets no token.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The uv the release build of pypi-publish.yml uses, pinned to the
          # same version and archive SHA-256 there (test_publish_workflow.py).
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          python-version: ${{ matrix.python-version }}
          # No cache: the build backend that build-constraints.txt pins is
          # fetched afresh and checked against its hashes, as for a release
          # build.
          enable-cache: false
      - run: make dist-check DIST_PYTHON=${{ matrix.python-version }}

  ci:
    # One stable check name to mark required in branch protection, so adding
    # or renaming a matrix entry does not silently drop the requirement.
    # `skipped` and `cancelled` count as failures here: the controller treats
    # a SKIPPED check run as passing, so this job must never skip its way to
    # green.
    name: ci
    needs: [test, static, sandbox, dist]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "test=${{ needs.test.result }} static=${{ needs.static.result }} sandbox=${{ needs.sandbox.result }} dist=${{ needs.dist.result }}"
          exit 1
