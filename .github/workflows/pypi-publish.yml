# Publishes one AutoForge release to PyPI through Trusted Publishing (OIDC),
# #295. docs/releasing.md has the one-time PyPI and GitHub setup, the
# procedure, and what to check after an upload.
#
# It runs only for a version tag: on the push of a tag `v*`, or by hand
# (`workflow_dispatch`) for such a tag, with `gh workflow run
# pypi-publish.yml --ref <tag>` (not the Actions tab's form, whose documented
# selector picks a branch), so that the workflow file, the code and the
# deployment ref of a run are all the tag's. It never runs on a pull request
# or a branch, and takes no input.
#
# `build` reads the repository and cannot mint an OIDC token. It refuses any
# ref but a version tag, then builds the sdist and the wheel exactly once
# with the check CI's `dist` job runs (tests/dist_check.py: build, inspect,
# install outside the checkout, run), which with `--release-tag` first
# refuses a tag that does not name the package's version. It records both
# files' SHA-256 (job summary, job outputs, SHA256SUMS) and uploads them.
#
# `publish` is the only job with `id-token: write`, and has no other
# permission. It runs in the `pypi` environment (a required reviewer, tags
# `v*` only), checks that the artifact holds exactly the two files the
# version names with the digests `build` recorded, and uploads them, with a
# PEP 740 attestation for each. PyPI trusts this workflow file in this
# repository and that environment; no PyPI token exists anywhere, and the
# workflow uses no secret.
#
# Every action is pinned to a full commit SHA; the comment names its release.
# uv is pinned to one version and the SHA-256 of its archive, the same pin as
# CI's `dist` job, and the build backend to the hashes of
# build-constraints.txt. One input is not pinned by content: the
# publish action runs in a container image it pulls from ghcr.io by a tag
# (the commit SHA), and a registry tag can be moved; docs/releasing.md
# records this. tests/test_publish_workflow.py keeps all of the above.
name: pypi-publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # the checkout of the tag; nothing else
    outputs:
      version: ${{ steps.dist.outputs.version }}
      sha256sums: ${{ steps.dist.outputs.sha256sums }}
    steps:
      - name: Refuse anything but a version tag
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: |
          echo "pypi-publish runs only for a version tag v*, not for ${GITHUB_REF}" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The uv CI's dist job runs, and its x86_64 Linux archive's SHA-256
          # (setup-uv v10.0.1 knows no checksum for it on its own).
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          python-version: "3.12"
          enable-cache: false
      - name: Check the tag, build once, inspect, install outside the checkout and run
        id: dist
        run: uv run --no-project --python 3.12 python -I tests/dist_check.py --release-tag "${GITHUB_REF_NAME}" --out-dir "${RUNNER_TEMP}/release/dist" --sha256sums "${RUNNER_TEMP}/release/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ runner.temp }}/release/dist/
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/autoforge-cli/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing: the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Re-verify exactly the files build recorded
        env:
          RECORDED: ${{ needs.build.outputs.sha256sums }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "${RECORDED}" | sed '/^$/d' > recorded.sha256
          cmp recorded.sha256 release/SHA256SUMS
          expected="$(printf '%s\n' "autoforge_cli-${VERSION}-py3-none-any.whl" "autoforge_cli-${VERSION}.tar.gz")"
          test "$(find release/dist -mindepth 1 -printf '%P\n' | LC_ALL=C sort)" = "${expected}"
          test "$(cut -d ' ' -f 3 recorded.sha256 | LC_ALL=C sort)" = "${expected}"
          (cd release/dist && sha256sum --check --strict ../../recorded.sha256)
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist/
          attestations: true
          print-hash: true
