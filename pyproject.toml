[project]
# The distribution name on PyPI (#256 D2): `autoforge` there is an unrelated
# project. The import package and the command both stay `autoforge`.
name = "autoforge-cli"
# Kept equal to `autoforge.__version__` by tests/test_packaging.py; the
# release procedure (docs/releasing.md) bumps both together.
version = "0.1.0a1.dev0"
description = "Autonomous orchestration for AI-driven software development (deterministic controller over Claude Code / OpenCode / gh)."
readme = "README.md"
# The oldest interpreter the code runs on, not a support claim: the supported
# interpreters are the classifiers below and docs/compatibility.md, which
# follow the CI matrix. No upper bound (docs/compatibility.md, "Python").
requires-python = ">=3.11"
# PEP 639: an SPDX expression and the file it names (#256 D1).
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ruoshi Li" }]
keywords = ["ai", "agents", "orchestration", "code-review", "github", "claude-code", "opencode"]
# Only what docs/compatibility.md claims supported (#256 D3): Linux, CPython
# 3.11 and 3.12. tests/test_packaging.py keeps the Python classifiers equal
# to the CI matrix.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
# Full YAML config support (without it, the built-in subset parser is used).
yaml = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/iceboundrock/AutoForge"
Documentation = "https://github.com/iceboundrock/AutoForge/tree/main/docs"
Source = "https://github.com/iceboundrock/AutoForge"
Issues = "https://github.com/iceboundrock/AutoForge/issues"
Changelog = "https://github.com/iceboundrock/AutoForge/blob/main/CHANGELOG.md"

[project.scripts]
autoforge = "autoforge.cli:main"

[build-system]
# 77.0 is the first setuptools with PEP 639 (`license` as an SPDX expression,
# `license-files`); an older one rejects both.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Every file the package reads at runtime ships in the wheel and the sdist:
# the prompt templates (`prompts_dir()`). tests/test_packaging.py fails when a
# file in the package is neither listed here nor named as not shipped, and
# when code reads a new file relative to the package.
[tool.setuptools.package-data]
"autoforge.prompts" = ["*.md"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: every skip prints its reason (a real-backend test names what the host lacks).
# -m "not live": a `live` test is deselected unless the command line selects it
# with `-m live` (a later -m wins); it then still skips without its variable.
addopts = "-q -rs -m 'not live'"
markers = [
    "live: calls a real agent and a real model; opt-in, never in `make check` or CI (docs/development.md)",
]
# A passed test's tmp_path is deleted when the test ends; one that failed or
# errored keeps it to inspect. Keeping every one fills a tmpfs /tmp
# (docs/development.md). tests/tmp_path_retention.py makes the per-test
# decision, because pytest's own reads only the call phase.
tmp_path_retention_policy = "failed"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
show_error_codes = true
