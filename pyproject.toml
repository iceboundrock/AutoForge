[project]
name = "autoforge-cli"
version = "0.1.0a0"
description = "Autonomous orchestration for AI-driven software development (deterministic controller over Claude Code / OpenCode / gh)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "coding-agent", "orchestration", "github", "cli"]

[project.urls]
Homepage = "https://github.com/iceboundrock/AutoForge"
Source = "https://github.com/iceboundrock/AutoForge"
Issues = "https://github.com/iceboundrock/AutoForge/issues"
dependencies = []

[project.optional-dependencies]
# Full YAML config support (without it, the built-in subset parser is used).
yaml = ["pyyaml>=6"]

[project.scripts]
autoforge = "autoforge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autoforge.prompts" = ["*.md"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: every skip prints its reason (a real-backend test names what the host lacks).
# -m "not live": a `live` test is deselected unless the command line selects it
# with `-m live` (a later -m wins); it then still skips without its variable.
addopts = "-q -rs -m 'not live'"
markers = [
    "live: calls a real agent and a real model; opt-in, never in `make check` or CI (docs/development.md)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
show_error_codes = true
